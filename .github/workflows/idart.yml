name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Trigger otomatis saat kamu buat tag rilis baru (misal: v1.0.0)
  workflow_dispatch: # Bisa juga dijalankan manual kapan saja

# Beri izin workflow untuk membuat Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      # Upload ke GitHub Releases (Bisa didownload publik tanpa login!)
      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
